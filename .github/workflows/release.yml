# 发布 Astral
#
# 手动触发：Actions → 发布 → Run workflow，输入标签名。
# 从 build.yml 最新一次成功运行的 artifacts 下载产物，创建 GitHub Release 并挂载。
# 推送 v* 标签只会触发 build.yml 编译，不会自动发布。
name: 发布

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git 标签（如 v1.0.12）'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 解析发布参数
        id: cfg
        run: |
          set -euxo pipefail
          TAG="${{ inputs.tag_name }}"
          VER="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"

      - name: 拉取 Windows zip
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: astral-windows-x64
          path: _dl/windows
          search_artifacts: true
          if_no_artifact_found: warn

      - name: 拉取 Linux
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: astral-linux-x64
          path: _dl/linux
          search_artifacts: true
          if_no_artifact_found: warn

      - name: 拉取 Android arm64
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: astral-android-arm64
          path: _dl/android-arm64
          search_artifacts: true
          if_no_artifact_found: warn

      - name: 拉取 Windows 安装包
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: astral-windows-x64-setup
          path: _dl/installer
          search_artifacts: true
          if_no_artifact_found: warn

      - name: 规范命名到 release/
        env:
          PKG_VER: ${{ steps.cfg.outputs.version }}
        run: |
          set -euxo pipefail
          mkdir -p release
          pick() { find _dl -type f -name "$1" 2>/dev/null | head -1; }
          f=$(pick '*.zip'); [ -n "$f" ] && cp -f "$f" "release/astral-${PKG_VER}-windows-x64.zip"
          f=$(pick '*.tar.gz'); [ -n "$f" ] && cp -f "$f" "release/astral-${PKG_VER}-linux-x64.tar.gz"
          f=$(find _dl/android-arm64 -name '*.apk' 2>/dev/null | head -1); [ -n "$f" ] && cp -f "$f" "release/astral-${PKG_VER}-android-arm64.apk"
          f=$(find _dl/installer -name '*.exe' 2>/dev/null | head -1); [ -n "$f" ] && cp -f "$f" "release/astral-${PKG_VER}-windows-x64-setup.exe"
          ls -la release/ || true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cfg.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -d release ] || [ -z "$(ls -A release 2>/dev/null || true)" ]; then
            echo "release/ 为空，无法创建 Release" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过 create"
            exit 0
          fi
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          gh release create "$TAG" --title "Astral $TAG" $PRE release/*
