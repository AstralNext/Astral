  crypto: ^3.0.6
  url_launcher: ^6.3.0
  window_manager: ^0.4.3
  flutter_staggered_grid_view: ^0.7.0
  path_provider: ^2.1.4
  package_info_plus: ^8.3.0
  tray_manager: ^0.5.2
  shared_preferences: ^2.3.3
  path: ^1.9.0
  vyuh_node_flow: ^0.27.3+1
  toml: ^0.18.0
  vm_service: ^15.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0




flutter:
