name: astral
description: "Astral"
publish_to: 'none'

version: 1.0.9

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  astral_rust_core:
    git:
      url: https://github.com/AstralNext/astral_rust_core.git
      ref: main
  vpn_service_plugin:
    git:
      url: https://github.com/AstralNext/vpn_service_plugin.git
      ref: main
  signals: ^6.3.0
  signals_flutter: ^6.3.0
  get_it: ^9.2.0
  logger: ^2.6.2
